name: bimaheadquarter_app
description: "A premium AI-powered self-service portal for insurance customers in Flutter."
publish_to: 'none'

version: 1.0.1+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.0
  flutter_riverpod: ^2.6.1
  intl: ^0.20.3
  gap: ^3.0.1
  fl_chart: ^1.2.0
  url_launcher: ^6.3.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/brand/app-logo.png
    - assets/brand/brand-logo.png
    - assets/brand/app-icon.png
    - assets/brand/main-logo.webp
    - assets/brand/main-logo-wide.webp
    - assets/brand/house-mark.webp
    - assets/brand/favicon.png
    - assets/brand/anand-soni.png
